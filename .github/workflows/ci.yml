name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }}, Neovim ${{ matrix.neovim }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
        neovim: [stable, nightly]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PIXEL_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:nvim
      - run: npm run test:nvim:window
      - run: npm run test:nvim:lifecycle
      - run: nvim --headless -u NONE -l test/presenter.lua
      - run: nvim --headless -u NONE -l test/mouse.lua

  lint:
    name: JavaScript and Lua checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIXEL_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin test
      - name: Install Lua checker
        run: sudo apt-get update && sudo apt-get install -y lua-check
      - run: luacheck lua plugin test/*.lua test/fixtures/*.lua

  renderer:
    name: Real renderer (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DOM selection, copy and lossless frames
        run: node scripts/smoke-text.js
      - name: Shared renderer and independent close
        run: node scripts/smoke-shared.js
        env:
          PEEKPANE_TEST_DISPLAY: window
      - name: Deferred Mermaid update after selection
        run: |
          for attempt in {1..8}; do
            node scripts/smoke-window-updates.js
          done
      - name: Transient capture failure recovery
        run: node scripts/smoke-capture.js
      - name: Repeated scroll actions and captured pixels
        run: node scripts/smoke-scroll.js
      - name: Native mouse clicks, drag selection and wheel
        run: node scripts/smoke-mouse.js
      - name: Neovim yank register integration
        run: npm run test:nvim:text
      - name: Neovim mouse integration
        run: npm run test:nvim:mouse
      - name: Upload deferred-rendering diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-rendering-diagnostics
          path: ${{ runner.temp }}/peekpane-deferred-debug
          if-no-files-found: ignore
